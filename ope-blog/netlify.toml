# Hosted deploy of the OPE demo publisher. The License Server is not hosted yet,
# so the hosted site stays on the v0.1 branch until it is (see README).
[build]
  command = "npx @11ty/eleventy"
  publish = "_site"
  functions = "functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["_site/_ope/**", "_site/posts/**"]

# OAuth metadata: JSON, readable from any origin
[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
