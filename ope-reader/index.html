<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPE Reader Demo</title>
<style>
  :root {
    --bg: #fafafa; --fg: #18181b; --muted: #52525b; --border: #e4e4e7; --card: #fff; --code: #f4f4f5;
    --accent: #047857; --accent-bg: #ecfdf5; --warn: #b45309; --warn-bg: #fffbeb; --bad: #b91c1c; --bad-bg: #fef2f2;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #09090b; --fg: #fafafa; --muted: #a1a1aa; --border: #27272a; --card: #18181b; --code: #27272a;
      --accent: #34d399; --accent-bg: #052e22; --warn: #fbbf24; --warn-bg: #2a1d05; --bad: #f87171; --bad-bg: #2a0b0b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.55 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  header { padding: 1.5rem 1rem; border-bottom: 1px solid var(--border); }
  header h1 { margin: 0; font-size: 1.25rem; }
  header p { margin: 0.25rem 0 0; color: var(--muted); font-size: 0.9rem; }
  main { max-width: 860px; margin: 0 auto; padding: 1rem; }
  .step { background: var(--card); border: 1px solid var(--border); border-radius: 10px; margin: 0 0 1rem; }
  .step > h2 { display: flex; gap: 0.6rem; align-items: center; margin: 0; padding: 0.75rem 1rem; font-size: 1rem; border-bottom: 1px solid var(--border); }
  .step > h2 .n { width: 1.6rem; height: 1.6rem; border-radius: 50%; display: grid; place-items: center; font-size: 0.8rem; background: var(--code); color: var(--muted); flex: none; }
  .step.done > h2 .n { background: var(--accent); color: var(--bg); }
  .step.error > h2 .n { background: var(--bad); color: var(--bg); }
  .step > h2 .spec { margin-left: auto; font: 0.75rem var(--mono); color: var(--muted); font-weight: normal; }
  .body { padding: 0.75rem 1rem 1rem; }
  .step:not(.open) .body { display: none; }
  .explain { color: var(--muted); font-size: 0.9rem; margin: 0 0 0.75rem; }
  pre { background: var(--code); padding: 0.75rem; border-radius: 6px; font: 0.78rem/1.5 var(--mono); overflow: auto; max-height: 320px; white-space: pre-wrap; word-break: break-word; margin: 0.5rem 0; }
  button { font: inherit; padding: 0.45rem 0.9rem; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--fg); cursor: pointer; margin: 0.25rem 0.4rem 0.25rem 0; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
  button:disabled { opacity: 0.5; cursor: default; }
  .item { display: flex; gap: 0.75rem; align-items: center; justify-content: space-between; border: 1px solid var(--border); border-left-width: 4px; border-radius: 6px; padding: 0.5rem 0.75rem; margin: 0.4rem 0; }
  .item.gated { border-left-color: var(--warn); } .item.free { border-left-color: var(--accent); }
  .tag { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
  .gated .tag { color: var(--warn); } .free .tag { color: var(--accent); }
  .status { display: inline-block; font: 600 0.8rem var(--mono); padding: 0.1rem 0.45rem; border-radius: 4px; }
  .s2 { background: var(--accent-bg); color: var(--accent); } .s4 { background: var(--warn-bg); color: var(--warn); } .s5 { background: var(--bad-bg); color: var(--bad); }
  iframe { width: 100%; height: 420px; border: 1px solid var(--border); border-radius: 6px; background: #fff; }
  label.inline { display: inline-flex; gap: 0.4rem; align-items: center; font-size: 0.9rem; color: var(--muted); }
  a { color: var(--accent); }
  .err { color: var(--bad); font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>OPE Reader</h1>
  <p>An app reading a subscriber-only post with Open Portable Entitlement v0.2, one protocol step at a time.</p>
</header>
<main id="steps"></main>

<script type="module">
import { createClient, generateDpopKey, pkce, decodeJwt } from "/ope-client.js";

const { publisher } = await (await fetch("/config.json")).json();
const proxied = (url, init) => fetch("/proxy?url=" + encodeURIComponent(url), init);
const client = createClient({ fetchPublisher: proxied });
const redirectUri = location.origin + "/callback";
const state = {}; // found, app, key, verifier, tokens, target

// ── Step scaffolding ──
const STEPS = [
  ["feed", "Read the feed", "Feeds profile"],
  ["discover", "Ask for the post with no token", "§7, §11.4"],
  ["register", "Register this app", "§8.2"],
  ["authorize", "Sign in and choose", "§8.1, §8.4"],
  ["token", "Exchange the code for a License Token", "§8.5, §9"],
  ["read", "Read the post", "§11.2"],
  ["stolen", "Try a copied token", "§14"],
  ["lifecycle", "Refresh and revoke", "§12"],
];
const root = document.getElementById("steps");
for (const [id, title, spec] of STEPS) {
  root.insertAdjacentHTML("beforeend", `<section class="step" id="s-${id}"><h2><span class="n">${STEPS.findIndex((s) => s[0] === id) + 1}</span>${title}<span class="spec">${spec}</span></h2><div class="body"></div></section>`);
}
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const json = (v) => `<pre>${esc(JSON.stringify(v, null, 2))}</pre>`;
const status = (n) => `<span class="status s${String(n)[0]}">${n}</span>`;
function step(id, html, { done = true, error = false } = {}) {
  const el = document.getElementById("s-" + id);
  el.classList.add("open");
  el.classList.toggle("done", done && !error);
  el.classList.toggle("error", error);
  el.querySelector(".body").innerHTML = html;
  return el.querySelector(".body");
}
function fail(id, err) { step(id, `<p class="err">${esc(err.message || err)}</p>`, { error: true }); console.error(err); }

// ── 1. Feed ──
async function loadFeed() {
  const feed = await (await proxied(publisher + "/feed.json")).json();
  const offers = (feed._ope?.offers || []).map((o) => `${esc(o.name)} ($${esc(o.payment.amount)})`).join(" · ");
  const body = step("feed", `<p class="explain">The feed marks gated posts with <code>_ope</code> and lists what's on offer. Choose a gated post to read it in this app.</p>
    <p><strong>${esc(feed.title)}</strong><br><span class="explain">Offers: ${offers}</span></p>
    ${feed.items.map((item, i) => `<div class="item ${item._ope ? "gated" : "free"}"><div><span class="tag">${item._ope ? "Gated" : "Free"}</span> ${esc(item.title)}${item._ope?.offers ? ` <span class="explain">(also sold on its own)</span>` : ""}</div>
      ${item._ope ? `<button data-i="${i}">Read</button>` : ""}</div>`).join("")}
    <label class="inline"><input type="checkbox" id="dpop" checked> Bind the token to a DPoP key</label>`);
  body.querySelectorAll("button[data-i]").forEach((b) => b.onclick = () => discover(feed.items[b.dataset.i]).catch((e) => fail("discover", e)));
}

// ── 2. Discovery ──
async function discover(item) {
  state.target = item;
  state.useDpop = document.getElementById("dpop").checked;
  const found = state.found = await client.discover(item.url);
  step("discover", `<p class="explain">The publisher answers <code>402</code> with challenges naming the post's scope. The scope's metadata (RFC 9728) names the License Server; its own metadata (RFC 8414) has the endpoints.</p>
    <p>GET ${esc(found.asset)} → ${status(found.status)}</p>
    ${json(found.challenges)}
    <p><strong>Resource metadata</strong> for <code>${esc(found.resourceMetadata.resource)}</code></p>${json(found.resourceMetadata)}
    <p><strong>License Server</strong> <code>${esc(found.authServer.issuer)}</code> issues for</p>${json(found.authServer.protected_resources)}
    <button class="primary" id="go-register">Register this app</button>`);
  document.getElementById("go-register").onclick = () => register().catch((e) => fail("register", e));
}

// ── 3. Registration ──
async function register() {
  state.app = await client.register(state.found.authServer, { clientName: "OPE Web Reader", redirectUri });
  state.key = state.useDpop ? await generateDpopKey() : null;
  step("register", `<p class="explain">A public client: no secret. ${state.key ? "The app also makes a DPoP key pair; the private key stays inside the browser's WebCrypto and can't be exported." : "No DPoP key: the token will be unbound."}</p>
    ${json(state.app)}${state.key ? `<p>DPoP key thumbprint <code>${esc(state.key.jkt)}</code></p>` : ""}
    <button class="primary" id="go-auth">Sign in at the License Server</button>`);
  document.getElementById("go-auth").onclick = () => authorize().catch((e) => fail("authorize", e));
}

// ── 4. Authorization (popup) ──
async function authorize() {
  const { verifier, challenge } = await pkce();
  state.verifier = verifier;
  state.oauthState = crypto.randomUUID();
  const url = client.authorizationUrl(state.found.authServer, {
    clientId: state.app.client_id, redirectUri, resource: state.found.asset, codeChallenge: challenge, state: state.oauthState,
  });
  step("authorize", `<p class="explain">The License Server signs the person in, shows what the app is asking for, and (in this demo) offers a pretend checkout. Any name works.</p><pre>${esc(url)}</pre><p>Waiting for the sign-in window…</p>`, { done: false });
  const popup = window.open(url, "ope-signin", "width=520,height=720");
  if (!popup) throw new Error("The sign-in window was blocked. Allow pop-ups for this page and try again.");
  const params = await new Promise((resolve) => {
    window.addEventListener("message", function onMessage(e) {
      if (e.origin !== location.origin || e.data?.ope !== "callback") return;
      window.removeEventListener("message", onMessage);
      resolve(e.data.params);
    });
  });
  if (params.error) throw new Error(`${params.error}: ${params.error_description || ""}`);
  if (params.state !== state.oauthState) throw new Error("state mismatch");
  if (params.iss !== state.found.authServer.issuer) throw new Error("iss mismatch (RFC 9207)");
  step("authorize", `<p class="explain">The License Server redirected back with a one-time code. <code>state</code> and <code>iss</code> match.</p>${json(params)}`);
  await exchange(params.code);
}

// ── 5. Token ──
async function exchange(code) {
  const as = state.found.authServer;
  state.tokens = await client.exchangeCode(as, {
    clientId: state.app.client_id, code, redirectUri, codeVerifier: state.verifier, resource: state.found.asset,
  }, state.key);
  showToken("token", "The token says who issued it, which publisher and URLs it covers, what kind of Entitlement it carries, and (if bound) which key must sign each request. The subject is opaque: the publisher never learns the person's name.");
  await read();
}
function showToken(id, explain) {
  const t = state.tokens;
  const header = JSON.parse(atob(t.access_token.split(".")[0].replace(/-/g, "+").replace(/_/g, "/")));
  step(id, `<p class="explain">${explain}</p>
    <p><code>token_type</code> ${esc(t.token_type)} · covers <code>${esc(t.resource)}</code> · expires in ${t.expires_in}s</p>
    <p><strong>Header</strong></p>${json(header)}<p><strong>Claims</strong></p>${json(decodeJwt(t.access_token))}`);
}

// ── 6. Read ──
async function read() {
  const r = await client.fetchAsset(state.target.url, state.tokens, state.key);
  const body = step("read", `<p class="explain">The app asks for the post at its own URL with <code>Authorization: ${esc(state.tokens.token_type)} …</code>${state.key ? " and a fresh DPoP proof" : ""}. The publisher checks the signature, coverage, Entitlement, key, and revocation.</p>
    <p>GET ${esc(state.target.url)} → ${status(r.status)}</p>
    ${r.ok ? `<iframe sandbox title="Post content"></iframe>` : json(r.challenges)}
    <p><button class="primary" id="go-stolen" ${state.key ? "" : "disabled"}>Try a copied token</button><button id="go-lifecycle">Refresh and revoke</button></p>`, { error: !r.ok });
  if (r.ok) body.querySelector("iframe").srcdoc = r.body.content_html;
  document.getElementById("go-stolen").onclick = () => stolen().catch((e) => fail("stolen", e));
  document.getElementById("go-lifecycle").onclick = () => lifecycle().catch((e) => fail("lifecycle", e));
}

// ── 7. A copied token ──
async function stolen() {
  const thief = await generateDpopKey();
  const a = await client.fetchAsset(state.target.url, state.tokens, thief);
  const b = await client.fetchAsset(state.target.url, { ...state.tokens, token_type: "License" }, null);
  step("stolen", `<p class="explain">Someone who copies a DPoP-bound token can't use it: every request needs a proof signed by the app's private key.</p>
    <p>With another key's proof → ${status(a.status)} <code>${esc(a.challenges[0]?.params.error_description)}</code></p>
    <p>As a License-scheme token → ${status(b.status)} <code>${esc(b.challenges[0]?.params.error_description)}</code></p>`);
}

// ── 8. Refresh and revoke ──
async function lifecycle() {
  const as = state.found.authServer;
  const body = step("lifecycle", `<p class="explain">Tokens last an hour. Refreshing returns a new refresh token and spends the old one; if a spent one ever comes back, the License Server ends the whole authorization. Revoking stops the token at the publisher right away, because the publisher checks with the License Server.</p>
    <button id="do-refresh">Refresh</button><button id="do-revoke">Revoke</button>
    <a href="${esc(as.issuer)}/account" target="_blank" rel="noopener">Manage subscriptions and apps at the License Server</a>
    <div id="lifecycle-out"></div>`);
  const out = body.querySelector("#lifecycle-out");
  body.querySelector("#do-refresh").onclick = async () => {
    try {
      state.tokens = await client.refresh(as, { clientId: state.app.client_id, refreshToken: state.tokens.refresh_token }, state.key);
      const r = await client.fetchAsset(state.target.url, state.tokens, state.key);
      out.innerHTML = `<p>Refreshed. New token reads the post → ${status(r.status)}</p>${json(decodeJwt(state.tokens.access_token))}`;
    } catch (e) { out.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
  };
  body.querySelector("#do-revoke").onclick = async () => {
    await client.revoke(as, { clientId: state.app.client_id, token: state.tokens.refresh_token });
    const r = await client.fetchAsset(state.target.url, state.tokens, state.key);
    out.innerHTML = `<p>Revoked. The same access token now gets ${status(r.status)} <code>${esc(r.challenges[0]?.params.error_description)}</code></p>`;
  };
}

loadFeed().catch((e) => fail("feed", e));
</script>
</body>
</html>
